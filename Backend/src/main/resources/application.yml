server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biopet_db}
    username: ${DB_APP_USER:biopet_app}
    password: ${DB_APP_PASSWORD:biopet_app_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: ${DB_USER:biopet_user}
    password: ${DB_PASSWORD:biopet_pass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL_MS:300000}
      cache-null-values: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${JWT_ISSUER:biopet-api}
    audience: ${JWT_AUDIENCE:biopet-frontend}
  cookie:
    access-name: access_token
    refresh-name: refresh_token
    secure: true
    same-site: Strict

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring:
  datasource:
    url: jdbc:h2:mem:biopet_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: simple

security:
  jwt:
    secret: test-secret-key-for-integration-tests-only-not-for-production-use-min-32-chars
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
    issuer: biopet-test-api
    audience: biopet-test-frontend
  cookie:
    access-name: access_token
    refresh-name: refresh_token
    secure: true
    same-site: Strict

app:
  cors:
    allowed-origins: http://localhost:4200

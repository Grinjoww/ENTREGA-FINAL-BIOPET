spring:
  datasource:
    url: jdbc:h2:mem:biopet_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: simple

# El perfil "test" no dispone de un servidor Redis real (ni en CI ni en un
# clon limpio sin "make up"): spring.cache.type=simple ya evita que la app
# necesite Redis para cachear, pero el RedisHealthIndicator de Actuator
# sigue registrado porque spring-boot-starter-data-redis esta en el
# classpath, y por defecto intenta conectarse a localhost:6379 para el
# endpoint /actuator/health. Sin ese servicio, el indicador reporta DOWN y
# el estado agregado de /actuator/health pasa a 503, aunque la aplicacion
# este perfectamente sana (HealthCheckTest). Se deshabilita EXCLUSIVAMENTE
# el indicador de Redis en este perfil de pruebas -- no el health en
# general, y no se toca application.yml productivo, donde Redis es un
# componente real (cache) y su indicador de salud debe seguir activo.
management:
  health:
    redis:
      enabled: false

security:
  jwt:
    secret: test-secret-key-for-integration-tests-only-not-for-production-use-min-32-chars
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
    issuer: biopet-test-api
    audience: biopet-test-frontend
  cookie:
    access-name: access_token
    refresh-name: refresh_token
    secure: true
    same-site: Strict

app:
  cors:
    allowed-origins: http://localhost:4200
